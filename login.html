<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | APS Robotics Championship 2026</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;

            background:
                radial-gradient(
                    circle at 20% 10%,
                    rgba(0, 234, 255, 0.10),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(155, 108, 255, 0.10),
                    transparent 30%
                ),
                #020711;

            color: #f5f9ff;
            font-family: "Poppins", sans-serif;
        }

        .login-card {
            width: min(430px, 100%);
            padding: 38px 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(10, 25, 45, 0.96),
                    rgba(3, 10, 21, 0.96)
                );

            border: 1px solid rgba(0, 234, 255, 0.22);
            border-radius: 24px;

            box-shadow: 0 25px 80px rgba(0,0,0,.55);
        }

        .logo {
            display: block;
            width: 75px;
            height: 75px;
            object-fit: contain;
            margin: 0 auto 20px;
        }

        .badge {
            text-align: center;
            color: #00eaff;
            font-size: .65rem;
            font-weight: 700;
            letter-spacing: 2px;
        }

        h1 {
            margin: 8px 0;
            text-align: center;
            font-family: "Orbitron", sans-serif;
            font-size: 1.8rem;
        }

        h1 span {
            color: #00eaff;
        }

        .subtitle {
            text-align: center;
            color: #8fa5bf;
            font-size: .8rem;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #c7d7e9;
            font-size: .78rem;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 17px;

            border: 1px solid rgba(83,161,255,.18);
            border-radius: 11px;
            outline: none;

            background: rgba(1,8,18,.8);
            color: #fff;
        }

        input:focus {
            border-color: #00eaff;
            box-shadow: 0 0 0 3px rgba(0,234,255,.07);
        }

        button {
            width: 100%;
            padding: 14px;

            border: 0;
            border-radius: 12px;

            background: linear-gradient(
                100deg,
                #00eaff,
                #4f8cff
            );

            color: #001018;

            font-family: "Orbitron", sans-serif;
            font-weight: 800;

            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #loginMessage {
            min-height: 22px;
            margin-top: 15px;
            text-align: center;
            color: #ff9dad;
            font-size: .75rem;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #8fa5bf;
            font-size: .75rem;
            text-decoration: none;
        }

        .back:hover {
            color: #00eaff;
        }
    </style>
</head>

<body>

<div class="login-card">

    <img
        class="logo"
        src="https://i.ibb.co/60g82LzR/Army-Welfare-Education-Society-logo-1.png"
        alt="APS Logo">

    <div class="badge">
        APS TINKERING LAB
    </div>

    <h1>
        ADMIN <span>LOGIN</span>
    </h1>

    <p class="subtitle">
        APS Robotics Championship 2026
    </p>

    <form id="loginForm">

        <label for="email">
            Admin Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter admin email"
            autocomplete="username"
            required>

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required>

        <button
            type="submit"
            id="loginBtn">

            LOGIN

        </button>

        <div id="loginMessage"></div>

    </form>

    <a href="index.html" class="back">
        ← Back to Home
    </a>

</div>

<script type="module">

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
} from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyCucXDNlA86tU9ACdPm-oZGsAP_keBZ_uo",

    authDomain:
        "aps-robotics-championship.firebaseapp.com",

    databaseURL:
        "https://aps-robotics-championship-default-rtdb.firebaseio.com",

    projectId:
        "aps-robotics-championship",

    storageBucket:
        "aps-robotics-championship.firebasestorage.app",

    messagingSenderId:
        "1063542904891",

    appId:
        "1:1063542904891:web:82ff9bb3fba0b87384a41e"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


const form =
    document.getElementById("loginForm");

const email =
    document.getElementById("email");

const password =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const message =
    document.getElementById("loginMessage");


form.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        message.textContent = "";

        loginBtn.disabled = true;
        loginBtn.textContent = "LOGGING IN...";


        try {

            await signInWithEmailAndPassword(
                auth,
                email.value.trim(),
                password.value
            );

            window.location.replace(
                "admin.html"
            );


        } catch (error) {

            console.error(
                "Firebase login error:",
                error
            );


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                message.textContent =
                    "Invalid email or password.";

            } else if (
                error.code ===
                "auth/invalid-email"
            ) {

                message.textContent =
                    "Please enter a valid email.";

            } else if (
                error.code ===
                "auth/user-not-found"
            ) {

                message.textContent =
                    "Admin account does not exist.";

            } else if (
                error.code ===
                "auth/wrong-password"
            ) {

                message.textContent =
                    "Incorrect password.";

            } else {

                message.textContent =
                    error.message;

            }


            loginBtn.disabled = false;
            loginBtn.textContent = "LOGIN";

        }

    }
);

</script>

</body>
</html>
