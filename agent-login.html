<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050816"
    >

    <title>Admin Login | APS Robotics Championship 2026</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="admin-login.css"
    >
</head>


<body>

    <div class="background">

        <div class="grid"></div>

        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>

    </div>


    <main class="login-page">

        <section class="login-card">


            <!-- BRAND -->

            <div class="brand">

                <div class="logo-box">

                    <img
                        src="https://i.ibb.co/60g82LzR/Army-Welfare-Education-Society-logo-1.png"
                        alt="AWES Logo"
                    >

                </div>


                <div class="brand-text">

                    <div class="brand-name">
                        APS TINKERING LAB
                    </div>

                    <div class="brand-event">
                        ROBOTICS CHAMPIONSHIP
                        <span>2026</span>
                    </div>

                </div>

            </div>


            <!-- SECURITY BADGE -->

            <div class="security-badge">

                <span class="security-dot"></span>

                SECURE ADMIN PORTAL

            </div>


            <!-- TITLE -->

            <div class="heading">

                <p class="eyebrow">
                    AUTHORIZED ACCESS ONLY
                </p>

                <h1>
                    Admin
                    <span>Login</span>
                </h1>

                <p class="description">
                    Sign in to manage registrations,
                    participants and championship data.
                </p>

            </div>


            <!-- FORM -->

            <form id="loginForm">


                <div class="field">

                    <label for="email">
                        Administrator Email
                    </label>

                    <div class="input-box">

                        <span class="input-icon">
                            ✉
                        </span>

                        <input
                            id="email"
                            type="email"
                            placeholder="Enter administrator email"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input
                            id="password"
                            type="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- STATUS -->

                <div
                    id="loginStatus"
                    class="login-status"
                ></div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="loginBtn"
                    class="login-btn"
                >

                    <span id="loginText">
                        ACCESS ADMIN PANEL
                    </span>

                    <span
                        id="loginLoading"
                        class="loading hidden"
                    >
                        <span></span>
                        <span></span>
                        <span></span>

                        AUTHENTICATING...
                    </span>

                </button>


            </form>


            <!-- FOOTER -->

            <div class="protected">

                <div class="lock-icon">
                    🔐
                </div>

                <div>

                    <strong>
                        Protected Area
                    </strong>

                    <small>
                        Authorized administrators only
                    </small>

                </div>

            </div>


            <div class="bottom-line">

                APS Tinkering Lab

                <span>•</span>

                Robotics Championship 2026

            </div>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Website
            </a>

        </section>

    </main>


    <script
        type="module"
        src="admin-login.js"
    ></script>

</body>

</html>
