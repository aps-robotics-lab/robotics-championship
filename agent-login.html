<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#020711">

    <title>Agent Login | APS Robotics Championship 2026</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@400;500;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="agent-login.css">

</head>


<body>

    <div class="background">

        <div class="grid"></div>

        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>

    </div>


    <main class="login-page">

        <div class="login-card">

            <!-- LOGO -->

            <div class="logo-wrap">

                <img
                    src="https://i.ibb.co/60g82LzR/Army-Welfare-Education-Society-logo-1.png"
                    alt="APS Logo">

            </div>


            <!-- BRAND -->

            <div class="brand">

                <span class="lab">
                    APS TINKERING LAB
                </span>

                <h1>
                    ROBOTICS
                    <span>CHAMPIONSHIP</span>
                </h1>

                <p>
                    2026
                </p>

            </div>


            <!-- AGENT BADGE -->

            <div class="agent-badge">

                <span class="status-dot"></span>

                AGENT PORTAL

            </div>


            <!-- FORM -->

            <form id="agentLoginForm">

                <div class="field">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-box">

                        <span class="input-icon">
                            @
                        </span>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter agent email"
                            autocomplete="username"
                            required>

                    </div>

                </div>


                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <span class="input-icon">
                            ●
                        </span>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password">

                            ◉

                        </button>

                    </div>

                </div>


                <div
                    id="loginStatus"
                    class="login-status">
                </div>


                <button
                    type="submit"
                    id="loginBtn"
                    class="login-btn">

                    <span id="loginText">
                        ACCESS AGENT PORTAL
                    </span>

                    <span
                        id="loginLoading"
                        class="hidden">

                        AUTHENTICATING...

                    </span>

                </button>

            </form>


            <!-- SECURITY -->

            <div class="security">

                <span>🔒</span>

                Secure Firebase Authentication

            </div>


            <!-- BACK -->

            <a
                href="help.html"
                class="back-link">

                ← Back to Help Center

            </a>

        </div>

    </main>


    <script type="module"
            src="agent-login.js">
    </script>

</body>

</html>
