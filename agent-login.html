<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title>Agent Login | APS Robotics Championship 2026</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="agent-login.css">
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="logo">
            <img
                src="https://i.ibb.co/60g82LzR/Army-Welfare-Education-Society-logo-1.png"
                alt="APS"
            >
        </div>

        <span class="eyebrow">
            APS TINKERING LAB
        </span>

        <h1>
            AGENT
            <span>LOGIN</span>
        </h1>

        <p class="subtitle">
            Help & Support Control Center
        </p>

        <form id="loginForm">

            <label>
                Agent Email

                <input
                    id="email"
                    type="email"
                    placeholder="Enter agent email"
                    autocomplete="username"
                    required
                >
            </label>

            <label>
                Password

                <div class="password-box">

                    <input
                        id="password"
                        type="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                    >
                        👁
                    </button>

                </div>
            </label>

            <button
                class="login-btn"
                type="submit"
            >
                ACCESS AGENT PANEL
            </button>

            <div
                id="loginMessage"
                class="message"
            ></div>

        </form>

        <a
            href="index.html"
            class="back"
        >
            ← Back to website
        </a>

    </div>

</div>

<script
    type="module"
    src="agent-login.js"
></script>

</body>
</html>
