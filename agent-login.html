<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#020711"
    >

    <title>Admin Login | APS Robotics Championship 2026</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="admin-login.css"
    >

</head>


<body>

    <div class="background-grid"></div>

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>


    <main class="login-wrapper">

        <section class="login-card">


            <div class="logo-box">

                <img
                    src="https://i.ibb.co/60g82LzR/Army-Welfare-Education-Society-logo-1.png"
                    alt="APS Logo"
                >

            </div>


            <div class="heading">

                <span class="eyebrow">
                    APS TINKERING LAB
                </span>

                <h1>
                    ADMIN
                    <span>LOGIN</span>
                </h1>

                <p>
                    Robotics Championship 2026
                </p>

            </div>


            <form id="adminLoginForm">


                <div class="field">

                    <label for="email">
                        Administrator Email
                    </label>

                    <div class="input-box">

                        <span class="input-icon">
                            ✉
                        </span>

                        <input
                            id="email"
                            type="email"
                            placeholder="Enter admin email"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input
                            id="password"
                            type="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <div
                    id="loginMessage"
                    class="login-message"
                ></div>


                <button
                    id="loginBtn"
                    type="submit"
                    class="login-btn"
                >

                    <span id="loginText">
                        ACCESS ADMIN PANEL
                    </span>

                    <span
                        id="loginLoading"
                        class="hidden"
                    >
                        AUTHENTICATING...
                    </span>

                </button>


            </form>


            <div class="security-note">

                <span>🔐</span>

                <div>

                    <strong>
                        Protected Area
                    </strong>

                    <small>
                        Authorized administrators only
                    </small>

                </div>

            </div>


            <div class="footer">

                APS Tinkering Lab
                <span>•</span>
                Robotics Championship 2026

            </div>


        </section>

    </main>


    <script
        type="module"
        src="admin-login.js"
    ></script>

</body>

</html>
