<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>APS Robotics Championship 2026 | Admin Panel</title>

<link rel="stylesheet" href="admin.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>

<body>

<div class="login-box">

<h1>APS Robotics Championship</h1>

<p>Admin Login</p>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="error"></p>

</div>

<div id="dashboard" style="display:none;">

<header>

<h1>APS Robotics Championship 2026</h1>

<p>Army Public School Lal Bahadur Shastri Marg</p>

</header>

<div class="cards">

<div class="card">
<h2 id="total">0</h2>
<p>Total Registrations</p>
</div>

<div class="card">
<h2 id="race">0</h2>
<p>🏁 Robo Race</p>
</div>

<div class="card">
<h2 id="war">0</h2>
<p>⚔️ Robo War</p>
</div>

<div class="card">
<h2 id="tug">0</h2>
<p>🤝 Robo Tug of War</p>
</div>

<div class="card">
<h2 id="soccer">0</h2>
<p>⚽ Robo Soccer</p>
</div>

</div>

<div class="search">

<input
type="text"
id="search"
placeholder="Search Registration ID / Name / Team">

<button onclick="searchRegistration()">
Search
</button>

</div>
<table>

<thead>

<tr>

<th>Registration ID</th>

<th>Student</th>

<th>Team</th>

<th>Events</th>

<th>Mobile</th>

</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

<script type="module" src="admin.js"></script>

</body>
</html>
