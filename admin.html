<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin | APS Robotics Championship</title>
<style>body{margin:0;background:#020711;color:#fff;font-family:Arial;padding:20px}.wrap{max-width:1200px;margin:auto}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{padding:18px;background:#09182a;border:1px solid #18334d;border-radius:14px}.filters{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}input,select,button{padding:10px;border-radius:8px}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #18334d;text-align:left}.message{color:#9caec5}.error{color:#ff7777}.success{color:#3ee8a8}</style></head><body><main class="wrap"><h1>APS Robotics Admin</h1><p id="adminEmail"></p><button id="logoutBtn">Logout</button>
<div class="stats"><div class="stat">Registrations <b id="totalRegistrations">0</b></div><div class="stat">Solo <b id="soloCount">0</b></div><div class="stat">Teams <b id="teamCount">0</b></div><div class="stat">Events <b id="eventEntries">0</b></div></div>
<div class="filters"><input id="search" placeholder="Search"><select id="typeFilter"><option value="all">All</option><option value="solo">Solo</option><option value="team">Team</option></select><select id="eventFilter"><option value="all">All Events</option><option>Robo Race</option><option>Robo War</option><option>Robo Tug of War</option><option>Robo Soccer</option></select></div>
<p id="status" class="message"></p><div class="table"><table><thead><tr><th>ID</th><th>Leader</th><th>Team</th><th>Type</th><th>Size</th><th>Contact</th><th>Events</th><th>Actions</th></tr></thead><tbody id="registrationBody"></tbody></table></div>
<div id="detailOverlay" class="hidden" style="display:none"><div id="detailContent"></div><button id="closeDetail">Close</button></div></main><script type="module" src="admin.js"></script></body></html>
