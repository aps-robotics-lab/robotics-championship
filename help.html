<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#020711"><title>Help Center | APS Robotics Championship 2026</title>
<style>
body{margin:0;min-height:100vh;background:#020711;color:#fff;font-family:Poppins,Arial,sans-serif;padding:25px}.wrap{max-width:800px;margin:auto;padding:35px;border-radius:24px;background:#071629;border:1px solid #18334d}h1{font-family:Orbitron;color:#40dfff}form{display:grid;gap:14px}input,select,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid #24435f;background:#06111f;color:#fff}.btn{padding:14px;border:0;border-radius:10px;background:linear-gradient(90deg,#3d9cff,#40dfff);font-weight:800}.message{min-height:22px}.error{color:#ff7777}
.ai{margin-bottom:25px;padding:18px;border-radius:16px;border:1px solid #24435f;background:#06111f}.ai button{margin:5px;padding:9px;border-radius:8px;border:1px solid #315675;background:#0b2036;color:#fff;cursor:pointer}
</style></head><body><main class="wrap"><h1>APS Robotics Championship Help Center</h1>
<section class="ai"><b>🤖 Quick AI Help</b><p id="aiAnswer">Ask about registration, events, or support.</p><button data-ai="registration">Registration</button><button data-ai="events">Events</button><button data-ai="ticket">Support Ticket</button></section>
<form id="helpForm">
<input name="name" placeholder="Your Name" required><input name="email" type="email" placeholder="Email" required><input name="mobile" placeholder="Mobile Number"><select name="category"><option>Registration</option><option>Events</option><option>Technical</option><option>General</option></select><textarea name="issue" rows="6" placeholder="Describe your issue..." required></textarea>
<div id="helpMessage" class="message"></div><button class="btn" type="submit">Submit Support Request</button>
</form></main><script type="module" src="help.js"></script>
<script>
const answers={registration:"Use the Registration page, enter the team leader details, choose team size, add members, select events, and submit.",events:"The championship includes Robo Race, Robo War, Robo Tug of War, and Robo Soccer. Check the official rules before participating.",ticket:"After submitting a support request, you receive a Ticket ID. Save it so an agent can identify your request."};
document.querySelectorAll("[data-ai]").forEach(b=>b.onclick=()=>document.getElementById("aiAnswer").textContent=answers[b.dataset.ai]);
</script></body></html>
