<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Registration Successful | APS Robotics Championship 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#040811;color:#fff;font-family:Poppins;text-align:center;padding:25px}.card{width:min(600px,100%);padding:55px 30px;background:#09111d;border:1px solid rgba(25,230,255,.25);border-radius:25px;box-shadow:0 25px 80px #000}.logo{width:80px;height:80px;object-fit:contain}.check{font-size:65px;color:#19e6ff;margin:20px}.card h1{font:800 34px Orbitron}.card h1 b{color:#19e6ff}.card p{color:#93a1b5}.id{display:inline-block;margin:20px;padding:12px 18px;border:1px dashed #19e6ff;color:#19e6ff;font:700 14px Orbitron;border-radius:9px}.btn{display:inline-block;margin:8px;padding:12px 18px;background:#19e6ff;color:#021019;text-decoration:none;border-radius:8px;font-weight:800}.btn.alt{background:#172034;color:#fff}
</style>
</head>
<body>
<div class="card">
<img class="logo" src="https://i.ibb.co/60g82LzR/Army-Welfare-Education-Society-logo-1.png" alt="APS Logo">
<div class="check">✓</div>
<h1>Registration <b>Successful</b></h1>
<p id="welcome">Your team has been registered for APS Robotics Championship 2026.</p>
<div class="id" id="registrationId">Registration submitted</div>
<div><a class="btn" href="index.html">Back to Home</a><a class="btn alt" href="registration.html">New Registration</a></div>
</div>
<script>
const id=sessionStorage.getItem("apsRegistrationId");
const name=sessionStorage.getItem("apsRegistrationName");
if(id)document.getElementById("registrationId").textContent=id;
if(name)document.getElementById("welcome").textContent=`Thank you, ${name}. Your team has been registered for APS Robotics Championship 2026.`;
</script>
</body>
</html>
