<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration Successful</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#040811;color:#fff;font-family:Poppins,Arial;text-align:center}.card{padding:45px;max-width:600px;background:#09111d;border:1px solid #19e6ff;border-radius:24px}.id{margin:20px;padding:12px;border:1px dashed #19e6ff;color:#19e6ff}a{display:inline-block;padding:12px 18px;background:#19e6ff;color:#001018;text-decoration:none;border-radius:8px}</style></head><body><div class="card"><div style="font-size:60px;color:#19e6ff">✓</div><h1>Registration Successful</h1><p id="welcome">Your team has been registered.</p><div class="id" id="registrationId">Registration submitted</div><a href="registration.html">New Registration</a></div><script>const id=sessionStorage.getItem("apsRegistrationId"),name=sessionStorage.getItem("apsRegistrationName");if(id)registrationId.textContent=id;if(name)welcome.textContent=`Thank you, ${{name}}. Your team has been registered for APS Robotics Championship 2026.`;</script></body></html>
