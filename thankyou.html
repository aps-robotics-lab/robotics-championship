<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration Successful | APS Robotics Championship 2026</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#174f7a44,transparent 30%),#020711;color:#fff;font-family:Arial;padding:20px}
.card{text-align:center;max-width:620px;width:100%;padding:50px 25px;background:#08172aee;border:1px solid #32e7ff33;border-radius:28px;box-shadow:0 25px 80px #000}
.icon{font-size:70px;color:#3ee8a8}
h1{font-size:38px}b,#registrationId{color:#32e7ff}
a{display:inline-block;margin:8px;padding:13px 18px;border-radius:10px;background:#32e7ff;color:#021019;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<div class="icon">✓</div>
<h1>Registration <b>Successful</b></h1>
<p id="welcome">Your registration has been successfully submitted for APS Robotics Championship 2026.</p>
<h2 id="registrationId">Loading...</h2>
<a href="index.html">Return Home</a>
<a href="registration.html">New Registration</a>
</div>
<script>
const p=new URLSearchParams(location.search);
const id=p.get("id")||sessionStorage.getItem("apsRegistrationId");
const name=sessionStorage.getItem("apsRegistrationName");
document.getElementById("registrationId").textContent=id||"Submitted";
if(name) document.getElementById("welcome").textContent=`Thank you, ${name}. Your registration has been successfully submitted for APS Robotics Championship 2026.`;
sessionStorage.removeItem("apsRegistrationId");
sessionStorage.removeItem("apsRegistrationName");
</script>
</body>
</html>
