<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#020711"><title>Support Request Submitted | APS Robotics Championship 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:22px;overflow:hidden;color:#f4f8ff;font-family:Poppins;background:radial-gradient(circle at 20% 20%,rgba(61,156,255,.18),transparent 30%),radial-gradient(circle at 80% 80%,rgba(64,223,255,.14),transparent 30%),linear-gradient(135deg,#020711,#08192e)}
.card{width:min(680px,100%);text-align:center;padding:55px 35px;border-radius:30px;border:1px solid rgba(126,181,255,.2);background:rgba(7,22,41,.82);backdrop-filter:blur(22px);box-shadow:0 30px 100px rgba(0,0,0,.45)}
.icon{width:92px;height:92px;margin:0 auto 24px;display:grid;place-items:center;border-radius:50%;font-size:45px;font-weight:800;color:#021019;background:linear-gradient(135deg,#3ee8a8,#40dfff);box-shadow:0 0 50px rgba(62,232,168,.28)}
.badge{display:inline-block;padding:8px 14px;border-radius:999px;color:#3ee8a8;background:rgba(62,232,168,.08);font:700 10px Orbitron;letter-spacing:1.5px}
h1{margin:20px 0 12px;font:800 clamp(27px,6vw,46px) Orbitron}p{max-width:540px;margin:auto;color:#9caec5;line-height:1.8}.ticket-box{margin-top:30px;padding:22px;border-radius:18px;border:1px solid rgba(64,223,255,.2);background:rgba(0,0,0,.18)}.ticket-box span{display:block;color:#9caec5;font-size:10px;letter-spacing:1.3px}.ticket-box strong{display:block;margin-top:9px;color:#40dfff;font:800 clamp(16px,4vw,26px) Orbitron;word-break:break-all}.warning{margin-top:20px;color:#ffd98a;font-size:12px}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:30px}a,button{border:0;cursor:pointer;padding:13px 20px;border-radius:11px;text-decoration:none;font:700 14px Poppins}.primary{color:#021019;background:linear-gradient(90deg,#3d9cff,#40dfff)}.secondary{color:#f4f8ff;background:rgba(255,255,255,.05);border:1px solid rgba(126,181,255,.2)}
</style></head><body><main class="card"><div class="icon">✓</div><div class="badge">SUPPORT TICKET CREATED</div><h1>We received your request</h1><p>Your support request has been successfully submitted to the APS Robotics Championship support system.</p><div class="ticket-box"><span>YOUR SUPPORT TICKET ID</span><strong id="ticketId">Loading...</strong></div><div class="warning">Please save this Ticket ID for your records.</div><div class="actions"><button class="secondary" id="copyBtn">Copy Ticket ID</button><a class="primary" href="index.html">Return Home</a></div></main>
<script>
const p=new URLSearchParams(location.search),ticket=p.get("ticket")||sessionStorage.getItem("apsHelpTicketId")||"Not available";document.getElementById("ticketId").textContent=ticket;document.getElementById("copyBtn").onclick=async function(){try{await navigator.clipboard.writeText(ticket);this.textContent="Copied ✓";setTimeout(()=>this.textContent="Copy Ticket ID",1800)}catch(e){alert("Ticket ID: "+ticket)}};
</script></body></html>
