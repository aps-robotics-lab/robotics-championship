<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020711"><title>Help Request | APS Robotics Championship 2026</title><link rel="stylesheet" href="help.css"><style>
.wrap{width:min(760px,94vw);margin:6vh auto;padding:36px;border:1px solid rgba(64,223,255,.2);border-radius:28px;background:rgba(5,16,30,.9);box-shadow:0 30px 90px rgba(0,0,0,.5);text-align:center;color:#fff}.ok{font-size:50px}.badge{display:inline-block;padding:7px 12px;border-radius:999px;background:rgba(64,223,255,.08);color:#58e2ff;font:700 10px Orbitron,sans-serif;letter-spacing:1.4px}.ref{margin:24px 0;padding:18px;border-radius:18px;background:rgba(64,223,255,.06);border:1px solid rgba(64,223,255,.16)}.ref strong{display:block;font:800 28px Orbitron,sans-serif;letter-spacing:2px}.waiting{color:#b7cad8;line-height:1.7}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:22px}.actions a,.actions button{padding:12px 18px;border-radius:12px;border:0;text-decoration:none;cursor:pointer;font-weight:700}.primary{background:#19d8ff;color:#02101a}.secondary{background:#102336;color:#dff8ff}.tracker{margin-top:28px;text-align:left;padding:20px;border:1px solid rgba(255,255,255,.08);border-radius:18px}.tracker input{width:100%;padding:12px;margin:7px 0;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#07111f;color:#fff}.tracker button{width:100%;padding:12px;border:0;border-radius:10px;background:#56e5a6;color:#03130d;font-weight:700}.result{margin-top:12px}.bar{height:8px;background:#102436;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#19d8ff,#56e5a6)}small{color:#8fa8ba}@media(max-width:600px){.wrap{padding:26px 18px}}
</style></head><body><main class="wrap"><div class="ok">✓</div><div class="badge">SUPPORT REQUEST RECEIVED</div><h1>We are reviewing your request.</h1><p class="waiting">Your request is currently <b>Waiting for Approval</b>. Our team will review it and contact you soon.</p><div class="ref"><small>HELP REFERENCE ID</small><strong id="ref">APS-XXXXX</strong></div><div class="actions"><button class="secondary" id="copy">Copy Reference</button><a class="primary" href="help.html#track">Track Progress</a><a class="secondary" href="index.html">Return Home</a></div><div class="tracker"><b>Quick Status Check</b><input id="email" type="email" placeholder="Email used for request"><button id="check">Check Current Progress</button><div id="result" class="result"></div></div></main><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {getDatabase,ref,get} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";
import {helpFirebaseConfig} from "./firebase-config.js";
const app=initializeApp(helpFirebaseConfig),db=getDatabase(app),params=new URLSearchParams(location.search);
const reference=(params.get("ref")||sessionStorage.getItem("apsHelpReferenceId")||"").toUpperCase();
document.getElementById("ref").textContent=reference||"Unavailable";
document.getElementById("copy").onclick=()=>navigator.clipboard?.writeText(reference);
async function hash(v){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v.trim().toLowerCase()));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
document.getElementById("check").onclick=async()=>{const email=document.getElementById("email").value.trim().toLowerCase();const r=document.getElementById("result");if(!email||!/^APS-[A-Z0-9]{5}$/.test(reference)){r.textContent="Please enter the email used for this request.";return}try{const h=await hash(email+"|"+reference);const s=await get(ref(db,`ticketStatusLookup/${reference}/${h}`));if(!s.exists()){r.textContent="No matching request found.";return}const x=s.val()||{},p=Math.max(0,Math.min(100,Number(x.progress)||0));r.innerHTML=`<strong>${String(x.status||"In Review")}</strong><div class="bar"><span style="width:${p}%"></span></div><p>${String(x.message||"Our team is reviewing your request.")}</p>`}catch(e){r.textContent="Unable to check progress right now."}};
</script></body></html>
