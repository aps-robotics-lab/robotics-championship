<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<meta
    name="theme-color"
    content="#020711">

<title>
    Support Agent | APS Robotics Championship 2026
</title>

<link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet">

<link
    rel="stylesheet"
    href="agent.css">

</head>


<body>

<div class="agent-bg"></div>


<header class="agent-topbar">

    <div class="agent-brand">

        <img
            src="https://i.ibb.co/60g82LzR/Army-Welfare-Education-Society-logo-1.png"
            alt="APS">

        <div>

            <span>
                APS TINKERING LAB
            </span>

            <strong>
                SUPPORT AGENT
            </strong>

        </div>

    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="rules.html">
            Rules
        </a>

        <button id="logoutBtn">
            Logout
        </button>

    </nav>

</header>


<main class="agent-container">


    <section class="agent-heading">

        <div>

            <span class="badge">
                SUPPORT CONTROL CENTER
            </span>

            <h1>
                Ticket
                <span>Management</span>
            </h1>

            <p>
                Review and respond to student support requests.
            </p>

        </div>

    </section>


    <!-- =================================================
         STATS
    ================================================= -->

    <section class="stats-grid">

        <div class="stat-card">

            <span>
                TOTAL
            </span>

            <strong id="totalTickets">
                0
            </strong>

        </div>


        <div class="stat-card open">

            <span>
                OPEN
            </span>

            <strong id="openTickets">
                0
            </strong>

        </div>


        <div class="stat-card progress">

            <span>
                IN PROGRESS
            </span>

            <strong id="progressTickets">
                0
            </strong>

        </div>


        <div class="stat-card closed">

            <span>
                CLOSED
            </span>

            <strong id="closedTickets">
                0
            </strong>

        </div>

    </section>


    <!-- =================================================
         TOOLBAR
    ================================================= -->

    <section class="toolbar">

        <input
            id="searchInput"
            type="search"
            placeholder="Search ticket, student, email...">


        <select id="statusFilter">

            <option value="all">
                All Tickets
            </option>

            <option value="Open">
                Open
            </option>

            <option value="In Progress">
                In Progress
            </option>

            <option value="Closed">
                Closed
            </option>

        </select>


        <button
            id="refreshBtn">
            Refresh
        </button>

    </section>


    <div
        id="agentStatus"
        class="agent-status">
    </div>


    <!-- =================================================
         TICKETS
    ================================================= -->

    <section class="tickets-card">

        <div
            id="ticketList"
            class="ticket-list">

        </div>

    </section>

</main>


<!-- =====================================================
     TICKET MODAL
===================================================== -->

<div
    id="ticketOverlay"
    class="modal hidden">

    <div class="ticket-modal">

        <button
            id="closeTicket"
            class="close-btn">
            ×
        </button>


        <div class="modal-title">

            <span>
                SUPPORT TICKET
            </span>

            <h2 id="modalTicketId">
                -
            </h2>

        </div>


        <div class="ticket-details">

            <div>
                <small>
                    STUDENT
                </small>

                <strong id="modalName">
                    -
                </strong>
            </div>


            <div>
                <small>
                    CLASS / SECTION
                </small>

                <strong id="modalClass">
                    -
                </strong>
            </div>


            <div>
                <small>
                    EMAIL
                </small>

                <strong id="modalEmail">
                    -
                </strong>
            </div>


            <div>
                <small>
                    REGISTRATION ID
                </small>

                <strong id="modalRegistration">
                    Not provided
                </strong>
            </div>

        </div>


        <div class="message-box">

            <small>
                SUBJECT
            </small>

            <h3 id="modalSubject">
                -
            </h3>


            <small>
                MESSAGE
            </small>

            <p id="modalMessage">
                -
            </p>

        </div>


        <div class="agent-controls">

            <label>

                Status

                <select id="modalStatus">

                    <option value="Open">
                        Open
                    </option>

                    <option value="In Progress">
                        In Progress
                    </option>

                    <option value="Closed">
                        Closed
                    </option>

                </select>

            </label>


            <label>

                Agent Reply

                <textarea
                    id="modalReply"
                    rows="5"
                    placeholder="Write your reply..."></textarea>

            </label>

        </div>


        <div
            id="modalMessageStatus"
            class="modal-message">
        </div>


        <button
            id="saveTicketBtn"
            class="save-btn">

            Save Ticket

        </button>

    </div>

</div>


<script
    type="module"
    src="agent.js">
</script>

</body>

</html>
