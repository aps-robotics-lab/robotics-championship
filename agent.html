<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Agent Help Desk</title><style>body{margin:0;background:#020711;color:#fff;font-family:Arial;padding:20px}.wrap{max-width:1200px;margin:auto}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{padding:18px;background:#09182a;border-radius:14px}.filters{display:flex;gap:10px;margin:20px 0}input,select,button{padding:10px;border-radius:8px}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #18334d;text-align:left}.table{overflow:auto}.status-badge{padding:4px 8px;border-radius:20px;background:#18334d}.resolved{color:#3ee8a8}</style></head><body><main class="wrap"><h1>🤖 Agent Help Desk</h1><p id="agentName"></p><p id="agentEmail"></p><button id="logoutBtn">Logout</button><div class="stats"><div class="stat">Total <b id="totalTickets">0</b></div><div class="stat">Open <b id="openTickets">0</b></div><div class="stat">Resolved <b id="resolvedTickets">0</b></div></div><div class="filters"><input id="search" placeholder="Search tickets"><select id="statusFilter"><option value="all">All</option><option value="open">Open</option><option value="resolved">Resolved</option></select></div><p id="status"></p><div class="table"><table><thead><tr><th>Ticket</th><th>Name</th><th>Email</th><th>Issue</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody id="ticketBody"></tbody></table></div><div id="detailOverlay" class="hidden" style="display:none"><div id="detailContent"></div><button id="closeDetail">Close</button></div></main><script type="module" src="agent.js"></script></body></html>
