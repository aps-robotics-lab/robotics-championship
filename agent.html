<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<meta
name="theme-color"
content="#050914">

<title>
APS Robotics | Agent Dashboard
</title>

<link
href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap"
rel="stylesheet">


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    min-height:100vh;

    background:
        radial-gradient(
            circle at top right,
            #123052,
            #050914 45%,
            #02050b
        );

    color:#f4f8ff;

    font-family:Poppins,sans-serif;

}


.hidden{
    display:none!important;
}


/* LOGIN */

.login-screen{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}


.login-card{

    width:min(430px,100%);

    padding:38px;

    border-radius:24px;

    background:rgba(8,16,31,.94);

    border:1px solid #203852;

    box-shadow:
        0 30px 80px #0008;

}


.logo{

    text-align:center;

    margin-bottom:30px;

}


.logo-icon{

    font-size:50px;

}


.logo h1{

    font-family:Orbitron,sans-serif;

    font-size:22px;

    margin:10px 0 5px;

}


.logo p{

    margin:0;

    color:#8092aa;

    font-size:13px;

}


label{

    display:block;

    margin-bottom:18px;

    font-size:13px;

    color:#aebbd0;

}


input,
select,
textarea{

    width:100%;

    margin-top:7px;

    padding:13px 14px;

    border-radius:11px;

    border:1px solid #263d57;

    background:#07101d;

    color:white;

    outline:none;

    font:inherit;

}


input:focus,
select:focus,
textarea:focus{

    border-color:#4edbff;

    box-shadow:
        0 0 0 3px #4edbff15;

}


button{

    border:0;

    cursor:pointer;

    font:inherit;

}


.login-btn{

    width:100%;

    padding:14px;

    border-radius:11px;

    background:#eaf8ff;

    color:#06101c;

    font-weight:700;

}


.error{

    margin-top:15px;

    padding:12px;

    border-radius:10px;

    background:#3a1620;

    color:#ff9dac;

    font-size:13px;

}


/* DASHBOARD */

.dashboard{

    padding:25px;

}


.topbar{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;

    padding:20px 25px;

    border-bottom:1px solid #17293d;

    background:#050b15dd;

    position:sticky;

    top:0;

    z-index:10;

    backdrop-filter:blur(18px);

}


.brand{

    display:flex;

    gap:13px;

    align-items:center;

}


.brand-icon{

    font-size:30px;

}


.brand strong{

    display:block;

    font-family:Orbitron,sans-serif;

}


.brand small{

    color:#71859d;

}


.logout{

    padding:10px 15px;

    border-radius:9px;

    background:#1a2635;

    color:#dce8f5;

}


.stats{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:15px;

    margin-bottom:20px;

}


.stat{

    padding:20px;

    border-radius:17px;

    background:#091322;

    border:1px solid #1a3048;

}


.stat small{

    color:#758aa4;

}


.stat strong{

    display:block;

    font-size:30px;

    margin-top:5px;

}


.toolbar{

    display:flex;

    gap:12px;

    margin-bottom:20px;

}


.search{

    flex:1;

}


.refresh{

    padding:12px 18px;

    border-radius:10px;

    background:#15263a;

    color:white;

}


/* TABLE */

.table-wrap{

    overflow:auto;

    border-radius:18px;

    border:1px solid #1b3149;

}


table{

    width:100%;

    border-collapse:collapse;

    min-width:1200px;

}


th,
td{

    padding:14px;

    text-align:left;

    border-bottom:1px solid #15273a;

    font-size:13px;

}


th{

    background:#091423;

    color:#7fa0bd;

    font-family:Orbitron,sans-serif;

    font-size:10px;

    letter-spacing:1px;

}


td{

    color:#dce6f1;

}


.status{

    display:inline-block;

    padding:5px 9px;

    border-radius:30px;

    font-size:11px;

    font-weight:700;

}


.status-open{

    background:#3b2910;

    color:#ffc95c;

}


.status-progress{

    background:#102f3d;

    color:#64dcff;

}


.status-resolved{

    background:#103021;

    color:#6de59a;

}


.action-btn{

    padding:7px 10px;

    border-radius:8px;

    background:#162b40;

    color:white;

}


/* MODAL */

.modal{

    position:fixed;

    inset:0;

    background:#000b;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    z-index:50;

}


.modal-card{

    width:min(720px,100%);

    max-height:90vh;

    overflow:auto;

    padding:28px;

    border-radius:20px;

    background:#091423;

    border:1px solid #203951;

}


.modal-head{

    display:flex;

    justify-content:space-between;

    gap:20px;

    margin-bottom:20px;

}


.close{

    width:38px;

    height:38px;

    border-radius:10px;

    background:#162536;

    color:white;

    font-size:22px;

}


.detail{

    margin-bottom:18px;

}


.detail small{

    display:block;

    color:#7188a2;

    margin-bottom:5px;

}


.detail p{

    margin:0;

    white-space:pre-wrap;

    line-height:1.7;

}


.modal-actions{

    display:flex;

    gap:10px;

    flex-wrap:wrap;

}


.save{

    padding:12px 18px;

    border-radius:10px;

    background:#eaf8ff;

    color:#06101c;

    font-weight:700;

}


@media(max-width:800px){

    .stats{

        grid-template-columns:
            repeat(2,1fr);

    }

    .topbar{

        align-items:flex-start;

    }

}


@media(max-width:520px){

    .dashboard{

        padding:12px;

    }

    .stats{

        grid-template-columns:1fr 1fr;

    }

    .login-card{

        padding:25px;

    }

}

</style>

</head>


<body>


<!-- LOGIN -->

<section
id="loginScreen"
class="login-screen">

<div class="login-card">

    <div class="logo">

        <div class="logo-icon">
            🤖
        </div>

        <h1>
            AGENT LOGIN
        </h1>

        <p>
            APS Robotics Championship Support
        </p>

    </div>


    <form id="loginForm">

        <label>

            Username

            <input
            id="username"
            required
            autocomplete="username">

        </label>


        <label>

            Password

            <input
            id="password"
            type="password"
            required
            autocomplete="current-password">

        </label>


        <button
        class="login-btn"
        type="submit">

            Sign In

        </button>


        <div
        id="loginError"
        class="error hidden">
        </div>

    </form>

</div>

</section>


<!-- DASHBOARD -->

<section
id="dashboardScreen"
class="hidden">


<header class="topbar">

    <div class="brand">

        <div class="brand-icon">
            🤖
        </div>

        <div>

            <strong>
                APS SUPPORT
            </strong>

            <small>
                Agent Dashboard
            </small>

        </div>

    </div>


    <button
    id="logoutBtn"
    class="logout">

        Logout

    </button>

</header>


<main class="dashboard">


<div class="stats">

    <div class="stat">

        <small>
            TOTAL
        </small>

        <strong id="totalCount">
            0
        </strong>

    </div>


    <div class="stat">

        <small>
            OPEN
        </small>

        <strong id="openCount">
            0
        </strong>

    </div>


    <div class="stat">

        <small>
            IN PROGRESS
        </small>

        <strong id="progressCount">
            0
        </strong>

    </div>


    <div class="stat">

        <small>
            RESOLVED
        </small>

        <strong id="resolvedCount">
            0
        </strong>

    </div>

</div>


<div class="toolbar">

    <input
    id="search"
    class="search"
    placeholder="Search ticket, name, email, registration ID...">

    <button
    id="refreshBtn"
    class="refresh">

        Refresh

    </button>

</div>


<div class="table-wrap">

<table>

<thead>

<tr>

<th>TICKET</th>
<th>DATE</th>
<th>STUDENT</th>
<th>REGISTRATION</th>
<th>CATEGORY</th>
<th>SUBJECT</th>
<th>STATUS</th>
<th>ACTION</th>

</tr>

</thead>


<tbody id="ticketBody">

</tbody>

</table>

</div>

</main>

</section>


<!-- EDIT MODAL -->

<div
id="modal"
class="modal hidden">

<div class="modal-card">


<div class="modal-head">

    <div>

        <h2 id="modalTitle">
            Ticket
        </h2>

        <small id="modalTicket">
        </small>

    </div>


    <button
    id="closeModal"
    class="close">

        ×

    </button>

</div>


<div class="detail">

    <small>
        Student
    </small>

    <p id="detailStudent"></p>

</div>


<div class="detail">

    <small>
        Contact
    </small>

    <p id="detailContact"></p>

</div>


<div class="detail">

    <small>
        Registration ID
    </small>

    <p id="detailRegistration"></p>

</div>


<div class="detail">

    <small>
        Message
    </small>

    <p id="detailMessage"></p>

</div>


<label>

    Status

    <select id="editStatus">

        <option value="Open">
            Open
        </option>

        <option value="In Progress">
            In Progress
        </option>

        <option value="Resolved">
            Resolved
        </option>

    </select>

</label>


<label>

    Agent Name

    <input
    id="editAgent"
    placeholder="Your name">

</label>


<label>

    Reply to Student

    <textarea
    id="editReply"
    rows="7"
    placeholder="Write your response..."></textarea>

</label>


<div class="modal-actions">

    <button
    id="saveBtn"
    class="save">

        Save & Notify Student

    </button>

</div>


<div
id="saveMessage"
class="error hidden">
</div>


</div>

</div>


<script>

let username = "";
let password = "";
let tickets = [];
let currentTicket = null;


/* ==========================================================
   LOGIN
========================================================== */

document
.getElementById("loginForm")
.addEventListener(
    "submit",
    function(event){

        event.preventDefault();

        username =
            document
            .getElementById("username")
            .value
            .trim();

        password =
            document
            .getElementById("password")
            .value;

        google.script.run
            .withSuccessHandler(
                function(result){

                    if(!result.success){

                        showLoginError(
                            result.message
                        );

                        return;

                    }

                    document
                    .getElementById("loginScreen")
                    .classList.add("hidden");

                    document
                    .getElementById("dashboardScreen")
                    .classList.remove("hidden");

                    loadTickets();

                }
            )
            .withFailureHandler(
                function(error){

                    showLoginError(
                        error.message ||
                        "Login failed."
                    );

                }
            )
            .authenticateAgent(
                username,
                password
            );

    }
);


/* ==========================================================
   LOGIN ERROR
========================================================== */

function showLoginError(message){

    const box =
        document
        .getElementById("loginError");

    box.textContent =
        message;

    box.classList.remove("hidden");

}


/* ==========================================================
   LOAD TICKETS
========================================================== */

function loadTickets(){

    google.script.run

        .withSuccessHandler(
            function(result){

                if(!result.success){

                    alert(result.message);

                    return;

                }

                tickets =
                    result.tickets || [];

                renderTickets();

            }
        )

        .withFailureHandler(
            function(error){

                alert(
                    error.message ||
                    "Unable to load tickets."
                );

            }
        )

        .getTickets(
            username,
            password
        );

}


/* ==========================================================
   RENDER
========================================================== */

function renderTickets(){

    const body =
        document
        .getElementById("ticketBody");

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    const filtered =
        tickets.filter(
            ticket => {

                const text =
                    [

                        ticket["Ticket ID"],
                        ticket["Student Name"],
                        ticket["Email"],
                        ticket["Registration ID"],
                        ticket["Category"],
                        ticket["Subject"],
                        ticket["Status"]

                    ]
                    .join(" ")
                    .toLowerCase();

                return text.includes(search);

            }
        );


    body.innerHTML = "";


    filtered.forEach(
        ticket => {

            const row =
                document.createElement("tr");


            row.innerHTML = `

<td>
${escapeHtml(ticket["Ticket ID"])}
</td>

<td>
${escapeHtml(ticket["Date"])}
</td>

<td>
${escapeHtml(ticket["Student Name"])}
<br>
<small>
${escapeHtml(ticket["Class"])}
-
${escapeHtml(ticket["Section"])}
</small>
</td>

<td>
${escapeHtml(ticket["Registration ID"])}
</td>

<td>
${escapeHtml(ticket["Category"])}
</td>

<td>
${escapeHtml(ticket["Subject"])}
</td>

<td>
${statusBadge(ticket["Status"])}
</td>

<td>

<button
class="action-btn"
onclick="openTicket('${escapeJs(ticket["Ticket ID"])}')">

View / Reply

</button>

</td>

`;

            body.appendChild(row);

        }
    );


    updateStats();

}


/* ==========================================================
   STATUS BADGE
========================================================== */

function statusBadge(status){

    let cls =
        "status-open";


    if(status === "In Progress")
        cls =
            "status-progress";


    if(status === "Resolved")
        cls =
            "status-resolved";


    return `
<span class="status ${cls}">
${escapeHtml(status || "Open")}
</span>
`;

}


/* ==========================================================
   STATS
========================================================== */

function updateStats(){

    const total =
        tickets.length;

    const open =
        tickets.filter(
            t => t["Status"] === "Open"
        ).length;

    const progress =
        tickets.filter(
            t => t["Status"] === "In Progress"
        ).length;

    const resolved =
        tickets.filter(
            t => t["Status"] === "Resolved"
        ).length;


    document
    .getElementById("totalCount")
    .textContent = total;


    document
    .getElementById("openCount")
    .textContent = open;


    document
    .getElementById("progressCount")
    .textContent = progress;


    document
    .getElementById("resolvedCount")
    .textContent = resolved;

}


/* ==========================================================
   OPEN TICKET
========================================================== */

function openTicket(ticketId){

    currentTicket =
        tickets.find(
            t =>
            String(t["Ticket ID"]) ===
            String(ticketId)
        );


    if(!currentTicket)
        return;


    document
    .getElementById("modalTitle")
    .textContent =
        currentTicket["Subject"];


    document
    .getElementById("modalTicket")
    .textContent =
        currentTicket["Ticket ID"];


    document
    .getElementById("detailStudent")
    .textContent =
        currentTicket["Student Name"] +
        " • Class " +
        currentTicket["Class"] +
        " • Section " +
        currentTicket["Section"];


    document
    .getElementById("detailContact")
    .textContent =
        currentTicket["Email"];


    document
    .getElementById("detailRegistration")
    .textContent =
        currentTicket["Registration ID"];


    document
    .getElementById("detailMessage")
    .textContent =
        currentTicket["Message"];


    document
    .getElementById("editStatus")
    .value =
        currentTicket["Status"] ||
        "Open";


    document
    .getElementById("editAgent")
    .value =
        currentTicket["Agent"] ||
        "";


    document
    .getElementById("editReply")
    .value =
        currentTicket["Agent Reply"] ||
        "";


    document
    .getElementById("saveMessage")
    .classList.add("hidden");


    document
    .getElementById("modal")
    .classList.remove("hidden");

}


/* ==========================================================
   CLOSE
========================================================== */

document
.getElementById("closeModal")
.addEventListener(
    "click",
    closeModal
);


function closeModal(){

    document
    .getElementById("modal")
    .classList.add("hidden");

}


/* ==========================================================
   SAVE
========================================================== */

document
.getElementById("saveBtn")
.addEventListener(
    "click",
    function(){

        if(!currentTicket)
            return;


        const status =
            document
            .getElementById("editStatus")
            .value;


        const agent =
            document
            .getElementById("editAgent")
            .value
            .trim();


        const reply =
            document
            .getElementById("editReply")
            .value
            .trim();


        const button =
            document
            .getElementById("saveBtn");


        button.disabled = true;

        button.textContent =
            "Saving...";


        google.script.run

            .withSuccessHandler(
                function(result){

                    button.disabled =
                        false;

                    button.textContent =
                        "Save & Notify Student";


                    if(!result.success){

                        showSaveError(
                            result.message
                        );

                        return;

                    }


                    closeModal();

                    loadTickets();

                }
            )

            .withFailureHandler(
                function(error){

                    button.disabled =
                        false;

                    button.textContent =
                        "Save & Notify Student";


                    showSaveError(
                        error.message ||
                        "Update failed."
                    );

                }
            )

            .updateTicket(

                username,
                password,

                currentTicket["Ticket ID"],

                status,

                agent,

                reply

            );

    }
);


/* ==========================================================
   SAVE ERROR
========================================================== */

function showSaveError(message){

    const box =
        document
        .getElementById("saveMessage");

    box.textContent =
        message;

    box.classList.remove("hidden");

}


/* ==========================================================
   SEARCH
========================================================== */

document
.getElementById("search")
.addEventListener(
    "input",
    renderTickets
);


/* ==========================================================
   REFRESH
========================================================== */

document
.getElementById("refreshBtn")
.addEventListener(
    "click",
    loadTickets
);


/* ==========================================================
   LOGOUT
========================================================== */

document
.getElementById("logoutBtn")
.addEventListener(
    "click",
    function(){

        username = "";
        password = "";
        tickets = [];

        document
        .getElementById("dashboardScreen")
        .classList.add("hidden");

        document
        .getElementById("loginScreen")
        .classList.remove("hidden");

        document
        .getElementById("password")
        .value = "";

    }
);


/* ==========================================================
   HTML SAFETY
========================================================== */

function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeJs(value){

    return String(value || "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,"&quot;");

}

</script>

</body>

</html>
