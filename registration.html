<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APS Robotics Championship 2026 | Registration</title>
<style>
body{margin:0;background:#020711;color:#fff;font-family:Poppins,Arial;padding:30px}
main{max-width:720px;margin:auto;background:#09182a;padding:30px;border-radius:24px;border:1px solid #32e7ff33}
input,select,textarea{width:100%;padding:13px;margin:7px 0;box-sizing:border-box;border-radius:10px;border:1px solid #ffffff22;background:#071221;color:#fff}
fieldset{border:1px solid #ffffff22;border-radius:14px;margin:15px 0;padding:15px}
label{display:inline-block;width:48%;padding:10px 0}
button{padding:13px 22px;border:0;border-radius:10px;background:#32e7ff;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>APS Robotics Championship 2026</h1>
<form id="registrationForm">
<input name="studentName" placeholder="Student / Team Leader Name" required>
<input name="class" placeholder="Class" required>
<input name="section" placeholder="Section" required>
<input name="mobile" type="tel" placeholder="Mobile Number" required>
<input name="email" type="email" placeholder="Email" required>
<input name="teamName" placeholder="Team Name">
<select name="type"><option value="solo">Solo</option><option value="team">Team</option></select>
<input name="teamSize" type="number" min="1" max="10" value="1" placeholder="Team Size">
<fieldset>
<legend>Select Event(s)</legend>
<label><input type="checkbox" name="events" value="Robo Race"> 🏁 Robo Race</label>
<label><input type="checkbox" name="events" value="Robo War"> ⚔️ Robo War</label>
<label><input type="checkbox" name="events" value="Robo Tug of War"> 🤝 Robo Tug of War</label>
<label><input type="checkbox" name="events" value="Robo Soccer"> ⚽ Robo Soccer</label>
</fieldset>
<textarea name="remarks" placeholder="Remarks"></textarea>
<button type="submit">Register Team</button>
</form>
</main>
<script type="module" src="./js/registration.js"></script>
</body>
</html>
