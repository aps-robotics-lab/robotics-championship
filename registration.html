<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050914">
<title>Registration | APS Robotics Championship 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="registration.css">
</head>
<body>
<header>
  <a href="index.html" class="brand">
    <img src="https://i.ibb.co/60g82LzR/Army-Welfare-Education-Society-logo-1.png" alt="APS Logo">
    <span>APS ROBOTICS<small>CHAMPIONSHIP 2026</small></span>
  </a>
  <div class="header-links"><a href="index.html">Home</a><a href="rules.html">Rules</a></div>
</header>

<main>
  <div class="heading">
    <span>TEAM REGISTRATION</span>
    <h1>Enter the <b>Arena</b></h1>
    <p>Choose solo participation or register a two-member team for APS Robotics Championship 2026.</p>
  </div>

  <form id="registrationForm">
    <section>
      <h2>Participation Type</h2>
      <div class="participation-options">
        <label class="choice-card active" id="soloChoice">
          <input type="radio" name="participationType" value="Solo" checked>
          <span class="choice-icon">◉</span>
          <span><strong>Solo</strong><small>Only the team leader participates. No member form is shown.</small></span>
        </label>
        <label class="choice-card" id="teamChoice">
          <input type="radio" name="participationType" value="Team">
          <span class="choice-icon">◉</span>
          <span><strong>Team of 2</strong><small>Team leader + 1 team member.</small></span>
        </label>
      </div>
    </section>

    <section>
      <h2>Team Leader</h2>
      <div class="grid">
        <label>Student Name<input id="studentName" required></label>
        <label>Team Name<input id="teamName" required></label>
        <label>Class<input id="className" required></label>
        <label>Section<input id="sectionName" required></label>
        <label>Mobile Number<input id="mobile" type="tel" required></label>
        <label>Email<input id="email" type="email" required></label>
      </div>
    </section>

    <section id="memberSection" class="member-section hidden-section" aria-hidden="true">
      <h2>Team Member</h2>
      <p class="section-note">This section appears only when you select <b>Team of 2</b>.</p>
      <div class="grid">
        <label>Member 2 Name<input id="member2"></label>
        <label>Member 2 Class<input id="member2Class"></label>
        <label>Member 2 Section<input id="member2Section"></label>
      </div>
    </section>

    <section>
      <h2>Select Event(s)</h2>
      <div class="events">
        <label><input type="checkbox" name="events" value="Robo Race"><span>🏁 Robo Race</span></label>
        <label><input type="checkbox" name="events" value="Robo War"><span>⚔️ Robo War</span></label>
        <label><input type="checkbox" name="events" value="Robo Tug of War"><span>🤝 Robo Tug of War</span></label>
        <label><input type="checkbox" name="events" value="Robo Soccer"><span>⚽ Robo Soccer</span></label>
      </div>
      <label class="full">Remarks<textarea id="remarks" rows="4" placeholder="Optional"></textarea></label>
    </section>

    <div id="formMessage" role="alert"></div>
    <button id="submitBtn" type="submit">Submit Registration →</button>
  </form>
</main>
<script type="module" src="registration.js"></script>
</body>
</html>
